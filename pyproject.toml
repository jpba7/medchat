[project]
name = "medchat"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.97.0",
    "celery[redis]>=5.6.3",
    "cryptography>=47.0.0",
    "django>=6.0.4",
    "django-celery-beat>=2.9.0",
    "django-environ>=0.13.0",
    "django-ninja>=1.6.2",
    "django-pgtrigger>=4.17.0",
    "httpx>=0.28.1",
    "langfuse>=4.5.1",
    "openai>=2.32.0",
    "psycopg[binary,pool]>=3.3.3",
    "pydantic>=2.13.3",
    "redis>=6.4.0",
    "uvicorn[standard]>=0.46.0",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "ipython>=9.13.0",
    "matplotlib>=3.10.9",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-django>=4.12.0",
    "ruff>=0.15.12",
]
